name: Project 10

on:
  schedule:
    # Always keep a successor queued while a run is active (see concurrency below): each run lasts ~5h45m,
    # so an extra run queued every 2 hours replaces the previous pending one and starts the moment the
    # active run ends. This is what keeps the monitor running 24/7.
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Duration (minutes)'
        default: '345'
      verbose:
        description: 'Verbose logs (debugging only)'
        type: boolean
        default: false
      debug:
        description: 'Upload sampled frames (debugging only)'
        type: boolean
        default: false

# Each run lasts almost 6h, so a new one must wait for the previous one
# instead of cancelling it. Only one run can be pending: a newer one replaces it.
concurrency:
  group: "project-10"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  project10:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: "imjac0b/${{ secrets.PROJECT_10_REPO }}"
          token: ${{ secrets.PROJECT_10_TOKEN }}
          path: src
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update -qq > /dev/null 2>&1
          sudo apt-get install -y -qq ffmpeg > /dev/null 2>&1
          pip install -q -r src/requirements.txt > /dev/null 2>&1

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/state
          key: project-10-s2-${{ github.run_id }}
          restore-keys: project-10-s2-

      - name: Run
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.PROJECT_10_WEBHOOK }}
          YT_COOKIES: ${{ secrets.PROJECT_10_COOKIES }}
          RUN_MINUTES: ${{ inputs.minutes || '345' }}
          QUIET: ${{ inputs.verbose && '0' || '1' }}
          DEBUG_DIR: ${{ inputs.debug && format('{0}/debug', runner.temp) || '' }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            export YT_COOKIES_FILE="$RUNNER_TEMP/cookies.txt"
          fi
          python src/monitor/main.py --state "$RUNNER_TEMP/state/state.json"

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/state
          key: project-10-s2-${{ github.run_id }}

      - name: Upload output
        if: always() && inputs.debug
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: ${{ runner.temp }}/debug
          retention-days: 1
