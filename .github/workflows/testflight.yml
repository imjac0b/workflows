name: Build

run-name: Build ${{ github.run_id }}

on:
  repository_dispatch:
    types: [build]

permissions:
  contents: read

# Each dispatch carries one opaque job. App source workflows serialize repeated pushes per app,
# while independent apps can build concurrently and retain each pending dispatch.

jobs:
  build:
    name: Build (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: release
            runner: macos-26
            xcode_major: "26"
            publish: true
          - lane: xcode27
            runner: xcode-27
            xcode_major: "27"
            publish: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      IOS_CI_EXPECTED_XCODE_MAJOR: ${{ matrix.xcode_major }}

    steps:
      - name: Prepare worker
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          if [[ "${{ matrix.xcode_major }}" == "26" ]]; then
            xcode_path="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26.6*.app' -print -quit)"
            if [[ -z "$xcode_path" ]]; then
              xcode_path="/Applications/Xcode.app"
            fi
            sudo xcode-select --switch "$xcode_path/Contents/Developer"
          fi
          xcodebuild -version

      - name: Prepare
        env:
          IOS_CI_JOB_ID: ${{ github.event.client_payload.job }}
          CI_CONTROL_REPO: ${{ secrets.CI_CONTROL_REPO }}
          CI_CONTROL_BRANCH: ${{ secrets.CI_CONTROL_BRANCH }}
          CI_CONTROL_JOBS_PATH: ${{ secrets.CI_CONTROL_JOBS_PATH }}
          GITHUB_PAT: ${{ secrets.CI_GITHUB_PAT }}
        run: bash scripts/ios-builder.sh prepare

      - name: Build
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: bash scripts/ios-builder.sh build

      - name: Publish
        if: success() && matrix.publish
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: bash scripts/ios-builder.sh publish

      - name: Finalize
        if: always()
        run: bash scripts/ios-builder.sh finalize
