name: Generate blog audio

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-audio-tts
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      QWEN_TTS_LANGUAGE: English

    steps:
      - name: Check out audio generator
        uses: actions/checkout@v4
        with:
          repository: imjac0b/blog-tts
          token: ${{ secrets.BLOG_PAT }}
          path: generator
          lfs: true

      - name: Check out blog source
        uses: actions/checkout@v4
        with:
          repository: imjac0b/jacob-com-hk
          token: ${{ secrets.BLOG_PAT }}
          path: source
          lfs: true

      - name: Check out gh-pages output
        uses: actions/checkout@v4
        with:
          repository: imjac0b/blog-tts
          ref: gh-pages
          token: ${{ secrets.BLOG_PAT }}
          path: pages
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: generator/requirements.txt

      - name: Install ffmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version
            exit 0
          fi

          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        working-directory: generator
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Clear gh-pages output
        working-directory: pages
        run: |
          git rm -r --ignore-unmatch .
          git clean -fdx

      - name: Generate cloned-voice blog audio
        working-directory: generator
        run: |
          python scripts/generate_blog_audio.py \
            --blog-dir ../source/src/content/blog \
            --output-dir ../pages \
            --public-prefix "" \
            --no-manifest

      - name: Publish generated audio to gh-pages
        working-directory: pages
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No generated audio changes on gh-pages."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate blog audio"
          git push
