name: Generate blog audio

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-audio
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.chunks.outputs.chunks }}

    steps:
      - name: Check out audio generator
        uses: actions/checkout@v4
        with:
          repository: imjac0b/blog-tts
          token: ${{ secrets.BLOG_PAT }}
          path: generator
          lfs: true

      - name: Check out blog source
        uses: actions/checkout@v4
        with:
          repository: imjac0b/jacob-com-hk
          token: ${{ secrets.BLOG_PAT }}
          path: source
          lfs: true

      - name: List blog chunks
        id: chunks
        working-directory: generator
        run: python scripts/list_blog_posts.py ../source/src/content/blog --max-chars 500 >> "$GITHUB_OUTPUT"

  generate:
    needs:
      - discover
      - warm-cache
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.discover.outputs.chunks) }}

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      BLOG_TTS_LOCAL_MODEL_ONLY: "1"
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_CACHE: ${{ github.workspace }}/.hf-cache/hub
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      NUMEXPR_NUM_THREADS: "4"
      QWEN_TTS_LANGUAGE: English
      TORCH_NUM_THREADS: "4"

    steps:
      - name: Check out audio generator
        uses: actions/checkout@v4
        with:
          repository: imjac0b/blog-tts
          token: ${{ secrets.BLOG_PAT }}
          path: generator
          lfs: true

      - name: Check out blog source
        uses: actions/checkout@v4
        with:
          repository: imjac0b/jacob-com-hk
          token: ${{ secrets.BLOG_PAT }}
          path: source
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: generator/requirements.txt

      - name: Restore Hugging Face model cache
        uses: actions/cache/restore@v4
        with:
          path: .hf-cache
          key: huggingface-qwen3-tts-12hz-1.7b-${{ runner.os }}
          restore-keys: |
            huggingface-qwen3-tts-12hz-
            huggingface-

      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg sox libsox-dev libsox-fmt-all
          ffmpeg -version
          sox --version

      - name: Install Python dependencies
        working-directory: generator
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install flash attention when CUDA is available
        working-directory: generator
        run: |
          if command -v nvidia-smi >/dev/null 2>&1; then
            python -m pip install flash-attn --no-build-isolation
          else
            echo "CUDA is unavailable on this runner; skipping flash-attn."
          fi

      - name: Generate cloned-voice chunk audio
        working-directory: generator
        run: |
          python scripts/generate_blog_audio.py \
            --blog-file ../source/src/content/blog/${{ matrix.chunk.file }} \
            --output-dir ../chunk-output/chunks \
            --model Qwen/Qwen3-TTS-12Hz-1.7B-Base \
            --public-prefix "" \
            --max-chars 500 \
            --chunk-index ${{ matrix.chunk.index }} \
            --no-manifest

      - name: Upload generated chunk audio
        uses: actions/upload-artifact@v4
        with:
          name: blog-audio-${{ matrix.chunk.slug }}-${{ matrix.chunk.index_padded }}
          path: chunk-output/chunks
          if-no-files-found: error

  warm-cache:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_CACHE: ${{ github.workspace }}/.hf-cache/hub

    steps:
      - name: Restore Hugging Face model cache
        id: hf-cache
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: huggingface-qwen3-tts-12hz-1.7b-${{ runner.os }}
          restore-keys: |
            huggingface-qwen3-tts-12hz-
            huggingface-

      - name: Download Qwen TTS model
        if: steps.hf-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade huggingface_hub
          python - <<'PY'
          from huggingface_hub import snapshot_download

          snapshot_download("Qwen/Qwen3-TTS-12Hz-1.7B-Base")
          PY

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out audio generator
        uses: actions/checkout@v4
        with:
          repository: imjac0b/blog-tts
          token: ${{ secrets.BLOG_PAT }}
          path: generator
          lfs: true

      - name: Check out gh-pages output
        uses: actions/checkout@v4
        with:
          repository: imjac0b/blog-tts
          ref: gh-pages
          token: ${{ secrets.BLOG_PAT }}
          path: pages
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install assembly dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install numpy soundfile

      - name: Clear gh-pages output
        working-directory: pages
        run: |
          git rm -r --ignore-unmatch .
          git clean -fdx

      - name: Download generated audio
        uses: actions/download-artifact@v4
        with:
          path: downloaded-chunks
          merge-multiple: true

      - name: Assemble final audio files
        run: |
          python generator/scripts/assemble_blog_audio.py \
            --chunks-dir downloaded-chunks \
            --output-dir pages

      - name: Publish generated audio to gh-pages
        working-directory: pages
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No generated audio changes on gh-pages."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate blog audio"
          git push
