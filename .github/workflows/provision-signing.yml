name: Provision signing

run-name: Provision ${{ github.run_id }}

# What gets provisioned is carried by secrets rather than dispatch inputs, so no
# identifier appears in the workflow file, the run name, or the run's parameters.
# Set CI_PROVISION_BUNDLE_IDS before each onboarding run; the platform, profile
# type and signing branch fall back to ios, appstore and main when left unset.
on:
  workflow_dispatch:

permissions:
  contents: read

# Writes to the signing repository, so never let two provisioning runs overlap.
concurrency:
  group: ios-signing-provision
  cancel-in-progress: false

jobs:
  provision:
    name: Provision
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Prepare worker
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Provision
        env:
          IOS_CI_PROVISION_BUNDLE_IDS: ${{ secrets.CI_PROVISION_BUNDLE_IDS }}
          IOS_CI_PROVISION_PLATFORM: ${{ secrets.CI_PROVISION_PLATFORM }}
          IOS_CI_PROVISION_TYPE: ${{ secrets.CI_PROVISION_TYPE }}
          IOS_CI_PROVISION_GIT_URL: ${{ secrets.CI_SIGNING_REPO_URL }}
          IOS_CI_PROVISION_GIT_BRANCH: ${{ secrets.CI_SIGNING_BRANCH }}
          GITHUB_PAT: ${{ secrets.CI_GITHUB_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: bash scripts/ios-builder.sh provision

      - name: Finalize
        if: always()
        run: bash scripts/ios-builder.sh finalize
