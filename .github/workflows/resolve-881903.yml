name: Resolve 881903 Live Streams
on:
  workflow_dispatch:
  #schedule:
  #  - cron: "*/30 * * * *"
  push:
    paths: ".github/workflows/resolve-881903.yml"
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Resolve live streams
        run: |
          for station in 881 903 864; do
            bun run scripts/resolve-881903.ts $station > live-$station.json
            bun run scripts/validate-hls.ts live-$station.json
          done
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: "${{ secrets.RESOLVE_881903_REPO }}"
          token: ${{ secrets.RESOLVE_881903_TOKEN }}
          path: "target-repo"
      - name: Commit and push changes
        run: |
          cp live-*.json target-repo/
          cd target-repo

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add live-*.json

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(stream): auto-update live stream URLs"
          git pull --rebase
          git push
