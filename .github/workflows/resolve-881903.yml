name: Resolve 881903 Live Streams

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  resolve:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        station: ["881", "903", "864"]

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve live stream
        run: bun run scripts/resolve-881903.ts ${{ matrix.station }} > live-${{ matrix.station }}.json

      - name: Validate HLS access
        run: bun run scripts/validate-hls.ts live-${{ matrix.station }}.json

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: "${{ secrets.RESOLVE_881903_REPO }}"
          token: ${{ secrets.RESOLVE_881903_TOKEN }}
          path: "target-repo"

      - name: Commit and push changes
        run: |
          # Copy the generated JSON file into the target repository folder
          cp live-${{ matrix.station }}.json target-repo/
          
          # Navigate into the target repository
          cd target-repo
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add live-${{ matrix.station }}.json
          
          if git diff --staged --quiet; then
            echo "No changes to commit for station ${{ matrix.station }}."
            exit 0
          fi
          
          git commit -m "chore(stream): auto-update live stream URL for ${{ matrix.station }}"
          
          # Pull with rebase to prevent conflicts from concurrent matrix jobs
          git pull --rebase
          git push