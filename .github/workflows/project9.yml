name: Project 9

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: "project-9"
  cancel-in-progress: true

jobs:
  project9:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: "imjac0b/${{ secrets.PROJECT_9_REPO }}"
          token: ${{ secrets.PROJECT_9_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch
        run: bun run scrape > /dev/null

      - name: Build
        env:
          CONCURRENCY: "512"
          PANEL_TIMEOUT_MS: "2500"
        run: bun run build > /dev/null

      - name: Commit and push data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Results belong on the data branch, not on the code branch checked
          # out above, so stage them in a worktree and leave this tree alone.
          worktree="$RUNNER_TEMP/data-branch"

          if git fetch --depth=1 origin +refs/heads/data:refs/remotes/origin/data; then
            git worktree add -b data "$worktree" origin/data
          else
            # First run: start the branch with no history behind it.
            git worktree add --detach "$worktree"
            git -C "$worktree" switch --orphan data
          fi

          rm -rf "$worktree/data"
          cp -R data "$worktree/data"
          cd "$worktree"

          git add data

          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -q -m "chore: auto-update data"
          # Push visibly; the repo name is a secret so Actions masks it in the
          # log, and push output carries no file names. Retry once for a
          # transient non-fast-forward.
          git push -u origin data || { git pull --rebase origin data && git push origin data; }
