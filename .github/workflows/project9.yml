name: Project 9

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: "project-9"
  cancel-in-progress: true

jobs:
  project9:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: "imjac0b/${{ secrets.PROJECT_9_REPO }}"
          token: ${{ secrets.PROJECT_9_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch
        run: bun run scrape > /dev/null

      - name: Build
        env:
          CONCURRENCY: "512"
          PANEL_TIMEOUT_MS: "2500"
        run: bun run build > /dev/null

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -q -m "chore: auto-update data"
          # Push visibly; the repo name is a secret so Actions masks it in the
          # log, and push output carries no file names. Retry once for a
          # transient non-fast-forward.
          git push || { git pull --rebase && git push; }
